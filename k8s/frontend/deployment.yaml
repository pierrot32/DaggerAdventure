apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dagger-adventure
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # image tag is rewritten in the Jenkins production promotion branch
          image: docker.io/pierrot32/daggeradventure_frontend:81-23f3b10b5f20

          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dagger-adventure
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
