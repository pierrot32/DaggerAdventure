apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # image tag is rewritten in the Jenkins production promotion branch
          image: docker.io/pierrot32/daggeradventure_backend:77-6eb1145f7b61
          env:
            # created out-of-band: kubectl -n dagger-adventure create secret generic
            # backend-secrets --from-literal=database-url=... --from-literal=jwt-secret=... \
            #   --from-literal=openai-api-key=...
            # (not managed by GitOps)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_MODEL
              value: "gpt-5.6-luna"
            - name: COOKIE_SECURE
              value: "true"
            # Optional: set to an existing account email to bootstrap admin access.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-admin-secrets
                  key: admin-email
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
