apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # image tag is rewritten in the Jenkins production promotion branch
          image: docker.io/pierrot32/daggeradventure_backend:26-261b23072e20
          env:
            # created out-of-band: kubectl -n dagger-adventure create secret generic
            # backend-secrets --from-literal=database-url=... --from-literal=jwt-secret=...
            # (not managed by GitOps)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: COOKIE_SECURE
              value: "true"
            # Optional: set to an existing account email to bootstrap admin access.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: admin-email
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
