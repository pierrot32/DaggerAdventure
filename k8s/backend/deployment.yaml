apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # image tag is rewritten in the Jenkins production promotion branch
          image: docker.io/pierrot32/daggeradventure_backend:91-88d92bba38e7
          env:
            # created out-of-band: kubectl -n dagger-adventure create secret generic
            # backend-secrets --from-literal=database-url=... --from-literal=jwt-secret=... \
            #   --from-literal=openai-api-key=...
            # (not managed by GitOps)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_MODEL
              value: "gpt-5.6-luna"
            - name: COOKIE_SECURE
              value: "true"
            # The public nginx proxy overwrites X-Forwarded-For and X-Real-IP.
            # The Argo installer configures the intermediate ingress-nginx to
            # pass only that trusted chain to this backend. Keep the service
            # and ingress NodePort private; do not copy this setting elsewhere.
            - name: TRUST_PROXY_HEADERS
              value: "true"
            - name: EMAIL_PROVIDER
              value: "smtp"
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: backend-email-secrets
                  key: email-from
            - name: EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-email-secrets
                  key: smtp-host
            - name: EMAIL_SMTP_PORT
              value: "587"
            - name: EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-email-secrets
                  key: smtp-username
            - name: EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-email-secrets
                  key: smtp-password
            - name: EMAIL_SMTP_TLS
              value: "starttls"
            - name: EMAIL_VERIFICATION_BASE_URL
              value: "https://daggeradventure.xyz/verify-email"
            # Optional: set to an existing account email to bootstrap admin access.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-admin-secrets
                  key: admin-email
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dagger-adventure
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
