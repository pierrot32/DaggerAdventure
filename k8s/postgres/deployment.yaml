apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dagger-adventure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: dagger_adventure
            - name: POSTGRES_USER
              value: dagger_adventure
            # created out-of-band: kubectl -n dagger-adventure create secret generic
            # postgres-secrets --from-literal=password=<value> (not managed by GitOps)
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            # avoids "initdb: directory not empty" when the PVC's root already has lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dagger_adventure"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dagger_adventure"]
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dagger-adventure
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dagger-adventure
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
