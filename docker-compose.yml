services:
  docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker

  jenkins:
    build: ./jenkins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "127.0.0.1:8081:8080" # local-only access; public access goes through nginx
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker-certs:/certs/client:ro

  nginx:
    image: nginx:alpine
    depends_on:
      - jenkins
      - k3s
    environment:
      - DOMAIN=${DOMAIN}
      - ARGOCD_DOMAIN=${ARGOCD_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
  
  ddns:
    image: alpine:latest
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - DDNS_PASSWORD=${DDNS_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl >/dev/null;
      HOST=$$(echo $$DOMAIN | cut -d. -f1);
      ROOT=$$(echo $$DOMAIN | cut -d. -f2-);
      while true; do
        curl -4 -s \"https://dynamicdns.park-your-domain.com/update?host=$$HOST&domain=$$ROOT&password=$$DDNS_PASSWORD\";
        sleep 900;
      done"

  k3s:
    image: rancher/k3s:v1.31.0-k3s1
    hostname: k3s
    privileged: true
    restart: unless-stopped
    command: server --disable=traefik --tls-san k3s --node-name k3s
    environment:
      K3S_KUBECONFIG_OUTPUT: /k3s-config/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "666"
    volumes:
      - k3s_server:/var/lib/rancher/k3s
      - k3s_config:/k3s-config
    tmpfs:
      - /run
      - /var/run

  argocd:
    build: ./argo
    restart: on-failure
    depends_on:
      - k3s
    volumes:
      - k3s_config:/k3s-config:ro

volumes:
  jenkins_home:
  docker-certs:
  docker-data:
  certbot_etc:
  certbot_www:
  k3s_server:
  k3s_config: