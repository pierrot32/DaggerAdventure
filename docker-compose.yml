services:
  jenkins:
    build: ./jenkins
    ports:
      - "127.0.0.1:8081:8080" # local-only access; public access goes through nginx
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    depends_on:
      - jenkins
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
  
  ddns:
    image: alpine:latest
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - DDNS_PASSWORD=${DDNS_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl >/dev/null;
      HOST=$$(echo $$DOMAIN | cut -d. -f1);
      ROOT=$$(echo $$DOMAIN | cut -d. -f2-);
      while true; do
        curl -4 -s \"https://dynamicdns.park-your-domain.com/update?host=$$HOST&domain=$$ROOT&password=$$DDNS_PASSWORD\";
        sleep 900;
      done"

volumes:
  jenkins_home:
  certbot_etc:
  certbot_www: